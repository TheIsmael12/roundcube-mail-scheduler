<roundcube:include file="includes/layout.html" />
<roundcube:include file="includes/menu.html" />
<roundcube:include file="includes/settings-menu.html" />

<h1 class="voice"><roundcube:label name="settings" /> : <roundcube:label name="mail_scheduler.autoreplies" /></h1>

<!-- lista de respuestas automáticas -->
<div id="layout-list" class="listbox selected" aria-labelledby="aria-label-autoreplylist">
	<div class="header">
		<a class="button icon back-sidebar-button" href="#sidebar"><span class="inner"><roundcube:label name="settings" /></span></a>
		<span id="aria-label-autoreplylist" class="header-title"><roundcube:label name="mail_scheduler.autoreplies" /></span>
		<a class="button icon toolbar-menu-button" href="#list-menu"><span class="inner"><roundcube:label name="menu" /></span></a>
	</div>
	<div class="scroller" aria-labelledby="aria-label-autoreplylist">
		<roundcube:object name="plugin.autoreplylist" id="autoreply-table" class="listing ms-listing"
			noheader="true" role="listbox" data-list="autoreply_list"
			data-label-msg="mail_scheduler.arlistempty" />
	</div>
	<div class="footer"></div>
</div>

<!-- edición -->
<div id="layout-content" role="main">
	<h2 id="aria-label-toolbar" class="voice"><roundcube:label name="arialabeltoolbar" /></h2>
	<div class="header" role="toolbar" aria-labelledby="aria-label-toolbar">
		<a class="button icon back-list-button" href="#back"><span class="inner"><roundcube:label name="back" /></span></a>
		<span class="header-title"></span>
		<div id="autoreplytoolbar" class="toolbar menu">
			<roundcube:button command="plugin.mail_scheduler-ar-add" type="link" class="create disabled" classAct="create"
				label="create" title="mail_scheduler.newautoreply" innerClass="inner" data-fab="true" />
			<roundcube:button command="plugin.mail_scheduler-ar-delete" type="link" class="delete disabled" classAct="delete"
				label="delete" title="mail_scheduler.deleteautoreply" innerClass="inner" />
		</div>
	</div>
	<div class="iframe-wrapper">
		<roundcube:object name="contentframe" id="preferences-frame" src="env:blankpage" title="mail_scheduler.autoreplies" />
	</div>
</div>

<roundcube:include file="includes/footer.html" />

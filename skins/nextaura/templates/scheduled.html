<roundcube:include file="includes/layout.html" />
<roundcube:include file="includes/menu.html" />
<roundcube:include file="includes/settings-menu.html" />

<h1 class="voice"><roundcube:label name="settings" /> : <roundcube:label name="mail_scheduler.scheduled" /></h1>

<!-- lista de envíos programados -->
<div id="layout-list" class="listbox selected" aria-labelledby="aria-label-scheduledlist">
	<div class="header">
		<a class="button icon back-sidebar-button" href="#sidebar"><span class="inner"><roundcube:label name="settings" /></span></a>
		<span id="aria-label-scheduledlist" class="header-title"><roundcube:label name="mail_scheduler.scheduled" /></span>
		<a class="button icon toolbar-menu-button" href="#list-menu"><span class="inner"><roundcube:label name="menu" /></span></a>
	</div>
	<roundcube:object name="plugin.scheduledfilter" id="ms-filter" />
	<div class="scroller" aria-labelledby="aria-label-scheduledlist">
		<roundcube:object name="plugin.scheduledlist" id="scheduled-table" class="listing ms-listing"
			noheader="true" role="listbox" data-list="scheduled_list"
			data-label-msg="mail_scheduler.listempty_pending" />
	</div>
	<div class="footer"></div>
</div>

<!-- detalle -->
<div id="layout-content" role="main">
	<h2 id="aria-label-toolbar" class="voice"><roundcube:label name="arialabeltoolbar" /></h2>
	<div class="header" role="toolbar" aria-labelledby="aria-label-toolbar">
		<a class="button icon back-list-button" href="#back"><span class="inner"><roundcube:label name="back" /></span></a>
		<span class="header-title"></span>
		<div id="scheduledtoolbar" class="toolbar menu">
			<roundcube:button command="plugin.mail_scheduler-new" type="link" class="create disabled" classAct="create"
				label="compose" title="writenewmessage" innerClass="inner" data-fab="true" />
			<roundcube:button command="plugin.mail_scheduler-cancel" type="link" class="delete disabled" classAct="delete"
				label="cancel" title="mail_scheduler.cancelsend" innerClass="inner" />
		</div>
	</div>
	<div class="iframe-wrapper">
		<roundcube:object name="contentframe" id="preferences-frame" src="env:blankpage" title="mail_scheduler.scheduled" />
	</div>
</div>

<roundcube:include file="includes/footer.html" />
